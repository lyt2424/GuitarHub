name: build-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build GuitarHub (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project GuitarHub.xcodeproj \
            -scheme GuitarHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R "ios/build/Build/Products/Release-iphoneos/GuitarHub.app" Payload/
          zip -qry "GuitarHub-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: "GuitarHub-unsigned.ipa"
          if-no-files-found: error
